name: build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Нативные раннеры под каждую пару OS/arch — кросс-тулчейн не нужен.
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: cyclo
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: cyclo
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: cyclo.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin: cyclo.exe
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
      - name: build
        run: cargo build --release -p cyclorithm-cli --target ${{ matrix.target }}
      - name: smoke test
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.bin }} run examples/valid/route.cyclo --start 2026-01-09T00:00:00 --end 2026-01-10T00:00:00 > /dev/null
      - name: package
        # Архив с триплетом в имени: голые `cyclo`/`cyclo.exe` с разных
        # архитектур затирали друг друга в релизе (basename-коллизия).
        shell: bash
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          NAME="cyclo-$VER-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
      - name: upload
        uses: actions/upload-artifact@v5
        with:
          name: cyclo-${{ matrix.target }}
          path: dist/cyclo-*.tar.gz
          if-no-files-found: error

  # Колёса Python-биндинга (abi3: один wheel на платформу для Python ≥3.10).
  # Матрица уже, чем у бинаря: macOS нет и там, и там (паритет с релизами).
  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --manifest-path crates/cyclorithm-python/Cargo.toml --out dist
      - name: smoke test
        shell: bash
        run: |
          pip install cyclorithm --no-index --find-links dist --force-reinstall
          python -c "import cyclorithm; print(cyclorithm.__version__)"
          python -c "import cyclorithm as c; out = c.run_file('examples/valid/route.cyclo', '2026-09-07T00:00:00', '2026-09-08T00:00:00'); print(len(out['events']), 'events')"
      - name: upload
        uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # C++-библиотека: shared-библиотека (.so/.dll) + заголовки в архив
  # `cyclo-cpp-<версия>-<триплет>.tar.gz`. Платформы — паритет с колёсами.
  cpp:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            libs: "*.so"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            libs: "*.so"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            libs: "*.dll*"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cpp-${{ matrix.target }}
      - name: build
        run: cargo build --release -p cyclorithm-cpp --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          NAME="cyclo-cpp-$VER-${{ matrix.target }}"
          mkdir -p "dist/$NAME/include"
          cp target/${{ matrix.target }}/release/${{ matrix.libs }} "dist/$NAME/"
          cp crates/cyclorithm-cpp/include/cyclorithm.h crates/cyclorithm-cpp/include/cyclorithm.hpp "dist/$NAME/include/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
      - name: upload
        uses: actions/upload-artifact@v5
        with:
          name: cpp-${{ matrix.target }}
          path: dist/cyclo-cpp-*.tar.gz
          if-no-files-found: error

  # Только на тегах v*: прикладывает бинарники, колёса и C++-библиотеку к GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, wheels, cpp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: cyclo-*
          path: dist
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: dist-wheels
      - uses: actions/download-artifact@v5
        with:
          pattern: cpp-*
          path: dist-cpp
      - name: show
        run: ls -R dist dist-wheels dist-cpp
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cyclo-*/*.tar.gz
            dist-wheels/wheels-*/*.whl
            dist-cpp/cpp-*/*.tar.gz
          generate_release_notes: true
