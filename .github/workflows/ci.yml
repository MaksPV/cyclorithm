name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: bindings
        working-directory: crates/cyclorithm-python
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest
          .venv/bin/maturin develop --release
          .venv/bin/python -m pytest python/tests/ -q
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: smoke
        working-directory: crates/cyclorithm-cpp
        run: |
          cargo build -p cyclorithm-cpp
          g++ -std=c++17 -I include tests/smoke.cpp ../../target/debug/libcyclorithm.a -ldl -lpthread -lm -o /tmp/smoke
          /tmp/smoke
      - name: smoke-asan
        working-directory: crates/cyclorithm-cpp
        run: |
          g++ -std=c++17 -g -fsanitize=address,undefined -I include tests/smoke.cpp ../../target/debug/libcyclorithm.a -ldl -lpthread -lm -o /tmp/smoke_asan
          /tmp/smoke_asan
