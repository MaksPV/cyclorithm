[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pygments-cyclo"
version = "0.1.0"
description = "Pygments lexer for the Cyclorithm DSL (.cyclo)"
requires-python = ">=3.9"
dependencies = ["pygments>=2.0"]

[project.entry-points."pygments.lexers"]
cyclo = "cyclo_lexer:CycloLexer"

[tool.setuptools]
py-modules = ["cyclo_lexer"]
